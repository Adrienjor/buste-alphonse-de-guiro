<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buste Alphonse de Guiro — Visualisation 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    h1 {
      font-size: 24px;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      background: #e8e8e8;
      border-radius: 8px;
    }

    .note {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Démonstrateur de numérisation 3D</h1>

    <p id="status" role="status" aria-live="polite">Chargement du modèle…</p>
    <p class="note">Faites glisser pour tourner autour du buste. Pincez ou utilisez la molette pour zoomer.</p>

    <model-viewer
      id="viewer"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      alt="Modèle 3D issu d'une photogrammétrie">
    </model-viewer>

    <p class="note">
      Modèle expérimental réalisé dans le cadre du projet
      « Corpus 3D du patrimoine sculpté fribourgeois ».
    </p>

  </div>

<script src="viewer.js"></script>
</body>
</html>
